<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Open the SS1 Physics tutorial questions in Google Drive."
    />
    <meta name="theme-color" content="#f5f7f4" />
    <title>SS1 Tutorial Questions</title>
    <link rel="stylesheet" href="../assets/site.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../" aria-label="Tutorial Questions home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <ellipse cx="12" cy="12" rx="9" ry="3.8"></ellipse>
            <ellipse
              cx="12"
              cy="12"
              rx="9"
              ry="3.8"
              transform="rotate(60 12 12)"
            ></ellipse>
            <ellipse
              cx="12"
              cy="12"
              rx="9"
              ry="3.8"
              transform="rotate(120 12 12)"
            ></ellipse>
            <circle class="atom-core" cx="12" cy="12" r="1.5"></circle>
          </svg>
        </span>
        <span>Tutorial Questions</span>
      </a>
      <span class="header-note">Tutorial with bash</span>
    </header>

    <main class="viewer-main">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="../">Home</a> / SS1
      </nav>
      <section class="viewer-heading">
        <div>
          <p class="eyebrow">SENIOR SECONDARY</p>
          <h1>SS1 Physics Tutorial Questions</h1>
        </div>
        <div class="viewer-actions">
          <a class="text-link" href="solution/">View solutions</a>
          <a
            class="button"
            href="https://drive.google.com/file/d/1s5Wm_xxiVkL1sLrbT5DlDuoKB2uK2VJL/view?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            >Open questions in Google Drive <span aria-hidden="true">↗</span></a
          >
        </div>
      </section>
      <p class="viewer-help">
        Google Drive controls access to this file. Sign in with an account that
        has permission if prompted.
      </p>
    </main>
  </body>
</html>
